[project]
name = "aiops"
version = "0.1.0"
description = "Reactive, read-only Kubernetes diagnostic agent and FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi==0.162.0",
    "kubernetes==37.0.1",
    "langchain==1.4.9",
    "langchain-core==1.7.6",
    "langchain-groq==1.1.3",
    "langgraph==1.2.20",
    "pydantic==2.14.2",
    "pyjwt>=2.10,<3",
    "python-dotenv==1.2.4",
    "python-multipart>=0.0.20,<1",
    "rich==15.0.0",
    "sqlalchemy>=2.0,<3",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
evaluation = [
    "giskard==3.0.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "starlette==1.10.0",
]

[tool.uv]
package = false
