# Single persistent Redis instance; the claim uses the default StorageClass.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelshop.name" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/part-of: sentinelshop
spec:
  type: ClusterIP
  selector:
    app: redis
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelshop.name" . }}-redis-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis-headless
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/part-of: sentinelshop
spec:
  type: ClusterIP
  selector:
    app: redis
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sentinelshop.name" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/part-of: sentinelshop
spec:
  serviceName: {{ include "sentinelshop.name" . }}-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/part-of: sentinelshop
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - redis-server
        - --appendonly
        - 'yes'
        ports:
        - name: redis
          containerPort: 6379
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        startupProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          exec: &id001
            command:
            - redis-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          exec: *id001
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      {{- if ne .Values.redis.persistence.storageClass nil }}
      storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
      {{- end }}
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.redis.persistence.size | quote }}
