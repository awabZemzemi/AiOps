server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /api/products {
        set $backend catalog:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 =503 /dependency-unavailable;
    }

    location = /api/orders {
        set $backend checkout:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 =503 /dependency-unavailable;
    }

    location = /dependency-unavailable {
        internal;
        default_type application/json;
        return 503 '{"detail":"API service unavailable"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
