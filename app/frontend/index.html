<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SentinelShop</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>SentinelShop</h1>
      <p>A tiny shop for a Kubernetes/SRE lab. Prices are in USD.</p>

      <p id="message" role="status" aria-live="polite">Loading products…</p>
      <section id="products" aria-label="Products"></section>
    </main>
  </body>
</html>
