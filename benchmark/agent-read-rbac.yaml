# Optional manual grant. The benchmark CLI never applies this file.
# Review ServiceAccount name/namespace against the existing Helm release first.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-bench-reader
  namespace: aiops-bench
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-bench-reader
  namespace: aiops-bench
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: aiops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-bench-reader
