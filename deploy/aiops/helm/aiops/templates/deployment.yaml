apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  # SQLite and the per-process login limiter require a single backend worker.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: AIOPS_DATABASE_URL
              value: sqlite:////data/aiops.db
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts: &mounts
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: temporary
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: AIOPS_KUBERNETES_MODE
              value: incluster
            - name: AIOPS_DATABASE_URL
              value: sqlite:////data/aiops.db
            - name: AIOPS_LOG_DIR
              value: /logs/backend
            - name: AIOPS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: AIOPS_JWT_SECRET
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: GROQ_API_KEY
          securityContext: *containerSecurity
          volumeMounts: *mounts
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aiops.name" . }}-data
        - name: logs
          emptyDir:
            sizeLimit: 64Mi
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
