apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiops
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
